<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="logo/logo.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jacob Trock's Resume" />
    <title>Resume - Jacob Trock's Site</title>
    <script>
      (() => {
        let last = 0;
        const spawn = (e) => {
          const now = Date.now();
          if (now - last < 35 || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          last = now;
          const p = e.touches ? e.touches[0] : e;
          if (!p || !document.body) return;
          const el = document.createElement("i");
          el.className = "pepper";
          el.style.left = p.clientX + "px";
          el.style.top = p.clientY + "px";
          el.onanimationend = () => el.remove();
          document.body.appendChild(el);
        };
        ["pointerdown", "pointermove", "touchmove"].forEach((ev) =>
          window.addEventListener(ev, spawn, { passive: true })
        );
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.14.0/devicon.min.css"
      defer
    />
    <link
      rel="stylesheet"
      href="main.css?v=14"
    />
  </head>
